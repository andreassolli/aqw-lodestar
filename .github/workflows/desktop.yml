# Builds the desktop app for Mac, Windows and Linux on GitHub's own machines, and
# the Chrome and Firefox extensions.
#
# Push a tag like v1.4.0 and everything is attached to a GitHub release for that
# tag. The app's updater reads that release, so it needs the latest*.yml and
# .blockmap files too. You can also run it by hand from the Actions tab ("Run
# workflow"); the files then appear under the run's Artifacts instead.
#
# Don't use Re-run on an old run for a new version. A re-run builds the commit
# that run started from, not the newest one.

name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
              desktop/dist/*.blockmap
              desktop/dist/latest*.yml
          - os: windows-latest
            script: dist:win
            files: |
              desktop/dist/*.exe
              desktop/dist/*.blockmap
              desktop/dist/latest*.yml
          - os: ubuntu-latest
            script: dist:linux
            files: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
              desktop/dist/*.blockmap
              desktop/dist/latest*.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The updater goes by the version in package.json, so it has to match the tag.
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "desktop/package.json says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - run: npm install

      - run: npm run ${{ matrix.script }}
        env:
          # No paid signing certificates: don't look for any (the Mac app is
          # ad-hoc signed by build/adhoc-sign.cjs instead).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: lodestar-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: lodestar-extension
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: AQW Lodestar ${{ github.ref_name }}
          files: artifacts/*
          body: |
            The Lodestar extension for Chrome and Firefox, and the desktop app with an option to stay on top of other windows.

            The Windows installer and the Linux AppImage update themselves after this. The Mac app, the portable Windows version and the `.deb` tell you when there's a new version to download.

            **Mac:** download the `.dmg`, open it and drag AQW Lodestar to Applications.
            The first time, right-click the app and choose Open (or allow it under
            System Settings → Privacy & Security → Open Anyway).

            **Windows:** download `setup-x64.exe` (or `setup-arm64.exe` for ARM PCs), or the
            `portable.exe` that runs without installing. If Windows shows "Windows protected
            your PC", choose More info → Run anyway.

            **Linux:** on Ubuntu, Debian or Mint, install the `.deb`
            (`sudo apt install ./aqw-lodestar_*.deb`). On other distributions use the `.AppImage`:
            make it executable (`chmod +x AQW-Lodestar-*.AppImage`) and open it (it needs
            `libfuse2`, which some distributions don't include by default).
