<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Saved Items</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="search-bar.css" />
</head>
<body>
  <header id="logo" aria-label="AQW Lodestar"></header>

  <section class="boosts">
    <h2>Active server boosts</h2>
    <button class="search-theme" type="button" aria-pressed="false" aria-label="Switch to dark theme">
      <svg class="search-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2"/></svg>
      <svg class="search-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 3.4v2M12 18.6v2M3.4 12h2M18.6 12h2M6 6l1.4 1.4M16.6 16.6 18 18M18 6l-1.4 1.4M7.4 16.6 6 18"/></svg>
    </button>
    <div class="boostRow" id="boosts"></div>
  </section>

  <div class="separator"></div>

  <div class="search-row">
    <div class="search-bar" role="search">
      <svg class="search-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.4" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <label class="search-vh" for="aqw_username">Search username</label>
      <input class="search-input" id="aqw_username" type="search" placeholder="Search username" autocomplete="off">
      <button class="search-submit" id="check_progress" type="button">
        <span class="search-label"><span>Check bag</span></span>
        <span class="search-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <div class="farmHeader">
    <h2>Items to Farm</h2>
    <div class="button-group">
      <button id="add-item" class="icon-button" type="button" title="Add an item through link"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 5H3"/><path d="M11 12H3"/><path d="M16 19H3"/><path d="M18 9v6"/><path d="M21 12h-6"/></svg></button>
      <button id="clear-all" class="icon-button" type="button" title="Remove everything"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>
  </div>

  <ul id="list"></ul>
  <p id="empty-message" hidden>
    Nothing here yet. Right-click a link and choose <strong>Add to "Items to farm"</strong>.
  </p>

  <div id="add-item-modal" class="lip-modal-overlay">
    <div class="lip-modal" role="dialog" aria-modal="true" aria-labelledby="add-item-title">
      <h3 id="add-item-title">Add item from link</h3>
      <input type="text" id="add-item-input" placeholder="Paste a wiki link" autocomplete="off" />
      <p id="add-item-status" class="lip-modal-status" hidden></p>
      <div class="lip-modal-actions">
        <button id="add-item-cancel" type="button">Cancel</button>
        <button id="add-item-confirm" type="button">Add</button>
      </div>
    </div>
  </div>

  <!-- shared -->
  <script src="../shared/constants.js"></script>
  <script src="../shared/text.js"></script>
  <script src="../shared/messaging.js"></script>
  <script src="../shared/wiki-parser.js"></script>
  <script src="../shared/aqcloset.js"></script>
  <script src="../shared/farm-entry.js"></script>
  <!-- popup components -->
  <script src="theme-toggle.js"></script>
  <script src="boosts.js"></script>
  <script src="farm-list.js"></script>
  <script src="add-item-modal.js"></script>
  <script src="inventory-check.js"></script>
  <script src="popup.js"></script>
</body>
</html>
